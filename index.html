  <script>
    (() => {
      const page = document.body;
      const frame = document.getElementById("game-frame");
      const detailsFrame = document.getElementById("game-details-frame");
      // Whether a "Play as a Guest" request is active. Persisted across iframe
      // reloads (resetGameFrame) so the guest identity survives the boot cycle.
      let pendingGuest = false;
      const cardLink = document.querySelector(".gameCard-0-2-136");
      const currentProfileImage = document.querySelector(".mainBody-0-2-58 .image-0-2-87");
      const currentProfileName = document.querySelector(".mainBody-0-2-58 .helloMessage-0-2-50 span");

      const getGameContext = () => {
        const cardImage = cardLink?.querySelector("img.img-0-2-133");
        return {
          type: "webblox:game-context",
          title: "Baseplate",
          creator: "by hardcore",
          iconUrl: cardImage?.currentSrc || cardImage?.src || cardImage?.getAttribute("data-savepage-src") || "",
        };
      };

      const enterGame = (asGuest = false) => {
        const gameContext = getGameContext();
        pendingGuest = asGuest;
        page.classList.add("game-open", "game-playing");
        detailsFrame.setAttribute("aria-hidden", "true");
        frame.setAttribute("aria-hidden", "false");
        frame.contentWindow?.postMessage(gameContext, "*");
        frame.contentWindow?.postMessage({ ...gameContext, type: "webblox:enter-game", guest: asGuest }, "*");
        window.setTimeout(() => frame.contentWindow?.postMessage(gameContext, "*"), 0);
        frame.focus();
      };

      const resetGameFrame = () => {
        const currentSrc = frame.getAttribute("src") || "game.html";
        const url = new URL(currentSrc, window.location.href);
        url.searchParams.set("session", String(Date.now()));
        frame.setAttribute("src", `${url.pathname}${url.search}`);
      };

      const setupGameDetails = () => {
        const doc = detailsFrame.contentDocument;
        if (!doc?.body) return;
        const creator = doc.querySelector(".creatorName-0-2-117");

        doc.querySelectorAll("a").forEach((link) => {
          if (link.textContent.trim() === "Discover") {
            link.href = "/games-webblox.html";
            link.removeAttribute("data-savepage-href");
            link.classList.remove("home-disabled-link");
            if (!link.dataset.webbloxDiscoverBound) {
              link.dataset.webbloxDiscoverBound = "true";
              link.addEventListener("click", (event) => {
                event.preventDefault();
                window.top.location.href = "/games-webblox.html";
              });
            }
            return;
          }
          if (link === creator) return;
          const linkCls = link.className || "";

          link.classList.add("home-disabled-link");
        });
        const joinButton = doc.querySelector(".newBuyButton-0-2-143");

        let guestButton = doc.querySelector(".webblox-guest-button");

          guestButton.type = "button";
          guestButton.className = "webblox-guest-button";
          guestButton.setAttribute("aria-label", "Play as a Guest");

          joinButton.parentNode?.insertBefore(guestButton, joinButton);
